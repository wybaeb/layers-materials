<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 15px/1.6 Inter, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #1e2027; color: #fff; padding: 24px;
  }
  .card {
    width: 100%; max-width: 400px; background: #262932;
    border: 1px solid rgba(255,255,255,.10); border-radius: 16px; padding: 32px;
    box-shadow: 0 24px 64px rgba(0,0,0,.45);
  }
  .kicker {
    font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 12px;
    letter-spacing: .18em; text-transform: uppercase; color: #ff5533; margin-bottom: 18px;
  }
  h1 { font-size: 19px; margin: 0 0 6px; font-weight: 800; letter-spacing: -.01em; }
  p.sub { margin: 0 0 22px; color: rgba(255,255,255,.62); font-size: 13px; }
  label { display: block; font-size: 12px; color: rgba(255,255,255,.62); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 9px; border: 1px solid rgba(255,255,255,.18);
    background: #1e2027; color: #fff; font-size: 15px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #ff5533; box-shadow: 0 0 0 3px rgba(255,85,51,.18); }
  button {
    width: 100%; margin-top: 14px; padding: 11px; border: 0; border-radius: 9px;
    background: #ff5533; color: #fff; font-size: 15px; font-weight: 700;
    font-family: inherit; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .err { margin-top: 12px; font-size: 13px; color: #ff8a7a; min-height: 18px; }
  .hint { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,.38); line-height: 1.6; }
</style>
</head>
<body>
<div class="card" id="gate">
  <div class="kicker">KARPOV.COURSES × LAYERS</div>
  <h1>Рабочая среда и AI-стек курса</h1>
  <p class="sub">Материалы курса закрыты паролем. Введите его один раз — он сохранится в этом браузере, остальные страницы откроются сразу.</p>
  <form id="f">
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">Открыть</button>
  </form>
  <div class="err" id="err"></div>
  <div class="hint">Расшифровка целиком в браузере: пароль никуда не отправляется, на сервере лежит только зашифрованный файл.</div>
</div>

  var err = document.getElementById('err');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    go.textContent = 'Открываем…';
    try {
      var key = await keyFromPassword(pw.value);
      var html = await open_(key);
      save(b64out(await crypto.subtle.exportKey('raw', key)));
      render(html);
    } catch (e) {
      err.textContent = e && e.message === 'OLD_BROWSER'
        ? 'Браузер устарел — обновите его или откройте в другом'
        : 'Неверный пароль';
      go.disabled = false;
      go.textContent = 'Открыть';
      pw.select();
    }
  });

  // Ссылка вида страница.html#k=пароль открывается сразу: фрагмент на сервер
  // не уходит и стирается из адресной строки до попытки входа.
  var frag = (location.hash.match(/^#k=(.+)$/) || [])[1];
  if (frag) {
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('gate').style.visibility = 'hidden';
    keyFromPassword(decodeURIComponent(frag)).then(async function (key) {
      var html = await open_(key);
      save(b64out(await crypto.subtle.exportKey('raw', key)));
      render(html);
    }).catch(function () {
      document.getElementById('gate').style.visibility = 'visible';
      err.textContent = 'Ссылка с неверным паролем';
    });
  } else {
    var saved = load();
    if (saved) {
      document.getElementById('gate').style.visibility = 'hidden';
      keyFromRaw(saved).then(open_).then(render).catch(function () {
        document.getElementById('gate').style.visibility = 'visible';
        err.textContent = 'Сохранённый пароль больше не подходит';
      });
    }
  }
})();
</script>
</body>
</html>
