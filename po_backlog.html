  var SALT = "Qwv9Z+VgLjOoyL2XN5Ci5A==";
  var IV = "VvH1tgOfoMmc079B";
  var ITER = 200000;
  var STORE = "lay_key_v1";   // сюда кладём УЖЕ выведенный ключ, не пароль

  function b64(s) {
    var bin = atob(s), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a;
  }
  function b64out(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function save(v) { try { localStorage.setItem(STORE, v); } catch (_) {} }
  function load() { try { return localStorage.getItem(STORE); } catch (_) { return null; } }

  // Дорогая часть — вывод ключа из пароля (PBKDF2). Делаем её ОДИН раз на
  // браузер: дальше в хранилище лежит сам ключ, и остальные страницы
  // открываются мгновенно, без повторной деривации.
  async function keyFromPassword(password) {
    var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
                                           'PBKDF2', false, ['deriveKey']);
    return await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']
    );
  }
  function keyFromRaw(raw) {
    return crypto.subtle.importKey('raw', b64(raw), { name: 'AES-GCM' }, false, ['decrypt']);
  }

  async function open_(key) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('OLD_BROWSER');
    }
    // Неверный ключ => провал проверки тега GCM => исключение.
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(PAYLOAD));
    var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  var form = document.getElementById('f');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');
  var err = document.getElementById('err');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    go.disabled = true;
    go.textContent = 'Открываем…';
    try {
      var key = await keyFromPassword(pw.value);
      var html = await open_(key);
      save(b64out(await crypto.subtle.exportKey('raw', key)));
      render(html);
    } catch (e) {
      err.textContent = e && e.message === 'OLD_BROWSER'
        ? 'Браузер устарел — обновите его или откройте в другом'
        : 'Неверный пароль';
      go.disabled = false;
      go.textContent = 'Открыть';
      pw.select();
    }
  });

  // не уходит и стирается из адресной строки до попытки входа.
  var frag = (location.hash.match(/^#k=(.+)$/) || [])[1];
  if (frag) {
    history.replaceState(null, '', location.pathname + location.search);
    document.getElementById('gate').style.visibility = 'hidden';
    keyFromPassword(decodeURIComponent(frag)).then(async function (key) {
      var html = await open_(key);
      save(b64out(await crypto.subtle.exportKey('raw', key)));
      render(html);
    }).catch(function () {
      document.getElementById('gate').style.visibility = 'visible';
      err.textContent = 'Ссылка с неверным паролем';
    });
  } else {
    var saved = load();
    if (saved) {
      document.getElementById('gate').style.visibility = 'hidden';
      keyFromRaw(saved).then(open_).then(render).catch(function () {
        document.getElementById('gate').style.visibility = 'visible';
        err.textContent = 'Сохранённый пароль больше не подходит';
      });
    }
  }
