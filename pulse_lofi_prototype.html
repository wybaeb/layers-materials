<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пульс — Lo‑Fi‑прототип</title><style>
:root{--ink:#1b1b1b;--paper:#eee9df;--card:#fffdf7;--accent:#df3b32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Arial,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:30px}.phone{width:min(390px,100%);min-height:760px;background:var(--card);border:3px solid;border-radius:40px;padding:22px 20px 28px;box-shadow:12px 12px 0 #d2cabb}.notch{width:90px;height:9px;background:#222;border-radius:9px;margin:0 auto 26px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:inherit}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:#6e6a61}h1{font-size:34px;line-height:1;margin:16px 0 10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.tabs button,.action{border:2px solid;border-radius:999px;background:transparent;padding:10px;font-weight:700;cursor:pointer}.tabs button.active,.action{background:#222;color:white}.panel{display:none}.panel.active{display:block}.card{border:2px solid;border-radius:16px;padding:16px;margin:12px 0;background:#faf7ef}.cardhead{display:flex;gap:12px;align-items:center}.ico{width:38px;height:38px;border:2px solid;border-radius:50%;display:grid;place-items:center;font-weight:800}.card h2{font-size:18px;margin:0}.card p{margin:4px 0 0;color:#666}.drag{float:right;font-size:20px}.chart{height:120px;display:flex;align-items:flex-end;gap:10px;margin-top:18px}.chart i{flex:1;border:2px solid;border-bottom:0;background:#bbb}.chart i:nth-child(1){height:35%}.chart i:nth-child(2){height:58%}.chart i:nth-child(3){height:48%}.chart i:nth-child(4){height:82%;background:var(--accent)}label{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #bbb}input{width:20px;height:20px}.action{width:100%;margin-top:22px}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#222;color:white;padding:12px 18px;border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><main class="stage"><section class="phone"><div class="notch"></div><div class="top"><b>ПУЛЬС</b><a href="pulse_lofi_landing.html">Лендинг</a></div><div class="tag">Интерактивный Lo‑Fi</div><h1>Доброе утро</h1><p>Настройте короткий обзор дня.</p><nav class="tabs"><button class="active" data-tab="overview">Обзор</button><button data-tab="edit">Состав</button><button data-tab="result">Итог</button></nav><section id="overview" class="panel active"><div class="card"><span class="drag">⠿</span><div class="cardhead"><span class="ico">1</span><div><h2>Задачи</h2><p>6 сегодня · 2 важных</p></div></div></div><div class="card"><span class="drag">⠿</span><div class="cardhead"><span class="ico">2</span><div><h2>Встречи</h2><p>Первая в 10:30</p></div></div></div><div class="card"><h2>Ритм недели</h2><div class="chart"><i></i><i></i><i></i><i></i></div></div></section><section id="edit" class="panel"><div class="card"><h2>Что показать</h2><label><input type="checkbox" checked data-widget="tasks"> Задачи</label><label><input type="checkbox" checked data-widget="meetings"> Встречи</label><label><input type="checkbox" checked data-widget="rhythm"> Ритм недели</label><label><input type="checkbox" data-widget="focus"> Время для фокуса</label></div><button class="action" id="save">Сохранить состав</button></section><section id="result" class="panel"><div class="card"><h2>Обзор готов</h2><p id="summary">Задачи, встречи и ритм недели.</p></div><button class="action" id="restart">Изменить состав</button></section></section></main><div class="toast" id="toast">Состав сохранён</div><script>
const buttons=[...document.querySelectorAll('[data-tab]')],panels=[...document.querySelectorAll('.panel')];function openTab(id){buttons.forEach(b=>b.classList.toggle('active',b.dataset.tab===id));panels.forEach(p=>p.classList.toggle('active',p.id===id))}buttons.forEach(b=>b.onclick=()=>openTab(b.dataset.tab));document.querySelector('#save').onclick=()=>{const names={tasks:'задачи',meetings:'встречи',rhythm:'ритм недели',focus:'время для фокуса'};const v=[...document.querySelectorAll('[data-widget]:checked')].map(x=>names[x.dataset.widget]);document.querySelector('#summary').textContent=v.length?`В обзор вошли: ${v.join(', ')}.`:'Обзор пуст. Вернитесь и выберите хотя бы один блок.';openTab('result');const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)};document.querySelector('#restart').onclick=()=>openTab('edit');
</script></body></html>
