<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 322' width='760' height='322' fill='none'><rect x='310' y='28' width='178' height='254' rx='8' fill='rgba(255,85,51,0.09)'/><text x='6' y='50' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='700' fill='rgba(255,255,255,0.5)'>МЕТРИКА</text><text x='118' y='50' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='700' fill='rgba(255,255,255,0.5)'>ЧТО СЧИТАЕМ</text><text x='318' y='50' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='700' fill='#ff5533'>МИН · ТИПИЧНО · МАКС</text><text x='496' y='50' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='700' fill='rgba(255,255,255,0.5)'>ДОВЕРИЕ</text><text x='602' y='50' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='12' font-weight='700' fill='rgba(255,255,255,0.5)'>ИСТОЧНИК И ДАТА</text><line x1='0' y1='62' x2='760' y2='62' stroke='rgba(255,255,255,0.14)' stroke-width='1'/><text x='6' y='89.0' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#ffffff'>MAU</text><text x='118' y='89.0' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='400' fill='rgba(255,255,255,0.78)'>Уникальные за месяц</text><text x='318' y='89.0' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#ffffff'>0,4 — 1,2 — 4,5 млн</text><text x='496' y='89.0' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='700' fill='#6FA9B3'>бенчмарк</text><text x='602' y='89.0' text-anchor='start' font-family='Inter, Helvetica Neue, Arial, sans-serif' font-size='13' font-weight='400' fill='rgba(255,255,255,0.78)'>Годовой отчёт, 2025</text><