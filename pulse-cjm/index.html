<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="favicon.svg">
  <title>Пульс — прототип исследования</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="recording-stage">
    <div class="stage-brand" aria-hidden="true">
      <span class="brand-mark">ПУЛЬС</span>
      <span class="brand-caption">утреннее решение</span>
    </div>

    <section class="phone" aria-label="Мобильный прототип Пульс">
      <div class="phone-speaker" aria-hidden="true"></div>
      <div class="app" id="app" aria-live="polite"></div>
    </section>

    <button class="demo-reset" id="resetDemo" type="button" title="Вернуть начало демонстрации">
      <span aria-hidden="true">↺</span> Начать заново
    </button>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
